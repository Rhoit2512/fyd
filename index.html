<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teddy Day 🧸</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="message.html">💌 Note</a>
        <a href="gallery.html">📸 Pics</a>
        <a href="gifts.html">🎟️ Gifts</a>
    </nav>
    <div class="container">
        <div class="card">
            <div style="font-size: 70px;">🧸</div>
            <h1>Happy Teddy Day!</h1>
            <p>You're the softest, cutest, and most huggable person I've ever met.</p>
            <button class="btn" onclick="teddyRain()">Send Bear Hugs!</button>
        </div>
    </div>
    <script>
        function teddyRain() {
            for(let i=0; i<15; i++) {
                setTimeout(() => {
                    const t = document.createElement('div');
                    t.innerHTML = '🧸';
                    t.style.position = 'fixed';
                    t.style.left = Math.random() * 90 + 'vw';
                    t.style.top = '-50px';
                    t.style.fontSize = '40px';
                    t.style.zIndex = '2000';
                    t.style.transition = 'all 2.5s linear';
                    document.body.appendChild(t);
                    setTimeout(() => { t.style.top = '110vh'; t.style.transform = 'rotate(360deg)'; }, 50);
                    setTimeout(() => t.remove(), 2600);
                }, i * 150);
            }
        }
    </script>
</body>
</html>
