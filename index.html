<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Surprise for You 🧸</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        #surprise-content { display: none; }
        .big-teddy {
            font-size: 120px;
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
            display: inline-block;
        }
        .big-teddy:active { transform: scale(1.2) rotate(5deg); }
        .tap-hint { font-size: 0.8rem; color: var(--dark-pink); animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="message.html">💌 Note</a>
        <a href="gallery.html">📸 Pics</a>
        <a href="gifts.html">🎟️ Gifts</a>
    </nav>

    <div class="container">
        <div id="intro-card" class="card">
            <h1>Hey Cutie...</h1>
            <p>I couldn't gift you a physical teddy bear today, so I made you something even better.</p>
            <button class="btn" onclick="showTeddy()">Open Your Gift 🎁</button>
        </div>

        <div id="surprise-content" class="card">
            <h1 style="font-size: 1.5rem;">Here is your Teddy!</h1>
            <div class="big-teddy" onclick="popLove(event)">🧸</div>
            <p class="tap-hint">Tap him for hugs!</p>
            <p>He's small, but he carries all my love.</p>
        </div>
    </div>

    <script>
        function showTeddy() {
            document.getElementById('intro-card').style.display = 'none';
            document.getElementById('surprise-content').style.display = 'block';
        }

        function popLove(e) {
            // Create small floating hearts/teddies where touched
            for(let i=0; i<6; i++) {
                const particle = document.createElement('div');
                const isTeddy = Math.random() > 0.5;
                particle.innerHTML = isTeddy ? '🧸' : '❤️';
                particle.style.position = 'fixed';
                
                // Position at the click/touch point
                const x = e.clientX || e.touches[0].clientX;
                const y = e.clientY || e.touches[0].clientY;
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.fontSize = '24px';
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '3000';
                particle.style.transition = 'all 1s ease-out';
                
                document.body.appendChild(particle);

                // Animate outwards
                setTimeout(() => {
                    const destinationX = (Math.random() - 0.5) * 300;
                    const destinationY = (Math.random() - 0.5) * 300 - 100;
                    particle.style.transform = `translate(${destinationX}px, ${destinationY}px) scale(0) rotate(360deg)`;
                    particle.style.opacity = '0';
                }, 10);

                setTimeout(() => particle.remove(), 1000);
            }
        }
    </script>
</body>
</html>
