<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Real Teddy 🧸</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 3/4;
            background: #000;
            border-radius: 30px;
            border: 5px solid var(--primary-pink);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirrors the camera */
        }

        .overlay-text {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-family: 'Pacifico', cursive;
            color: white;
            font-size: 1.8rem;
            text-shadow: 2px 2px 8px rgba(214, 51, 132, 0.8);
            z-index: 10;
            pointer-events: none;
        }

        .bear-ears {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 60px;
            font-size: 50px;
            opacity: 0.8;
            pointer-events: none;
        }

        .btn-capture {
            margin-top: 20px;
            background: #d63384;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="camera.html">📸 Mirror</a>
        <a href="gallery.html">🖼️ Pics</a>
        <a href="gifts.html">🎟️ Gifts</a>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Look into the mirror...</h1>
            
            <div class="camera-container">
                <video id="video" autoplay playsinline></video>
                <div class="bear-ears"><span>🧸</span><span>🧸</span></div>
                <div class="overlay-text">You're my Teddy Bear! ❤️</div>
            </div>

            <p id="error-msg" style="color: red; display: none; margin-top: 10px;">Please enable camera access to see the surprise!</p>
            <button class="btn btn-capture" onclick="startCamera()">Open Mirror ✨</button>
        </div>
    </div>

    <script>
        async function startCamera() {
            const video = document.getElementById('video');
            const errorMsg = document.getElementById('error-msg');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
                errorMsg.style.display = 'none';
            } catch (err) {
                console.error("Error accessing camera: ", err);
                errorMsg.style.display = 'block';
                errorMsg.innerText = "Camera access denied. Please allow it in settings!";
            }
        }
    </script>
</body>
</html>
